<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNPREDICTABLE // Standalone</title>
<style>
:root{--bg:#05080d;--floor:#09131a;--line:#263a45;--cyan:#70f4df;--amber:#f8b85e;--purple:#a98bff;--red:#ff6574;--text:#e9edf2;--muted:#7e8894}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 25% 35%,#12212a,#05080d 58%);color:var(--text);font:12px Consolas,monospace}body{display:flex;justify-content:center}.shell{width:min(1240px,100%);padding:18px 24px;display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:100vh}.bar,.hud,.foot{border:1px solid #263643;background:linear-gradient(#16232c,#0a1118);box-shadow:inset 0 1px #8293a322,0 8px 25px #0008}.bar{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font:bold 22px Georgia,serif;letter-spacing:.12em}.brand b{color:var(--cyan)}.signal{color:var(--muted);font-size:10px}.dot{display:inline-block;width:7px;height:7px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);margin-right:7px}.stage{position:relative;overflow:hidden;min-height:540px;border:1px solid #1b2c36;background:radial-gradient(ellipse at 26% 40%,#12212a,#070d13 53%,#04070b);box-shadow:inset 0 1px #7c9aaa22,0 24px 70px #000b;display:flex;align-items:flex-start;justify-content:flex-start;padding:20px 0 0}.stage canvas{filter:drop-shadow(18px 25px 25px #000b);max-width:100%;height:auto}.scan{position:absolute;inset:0;pointer-events:none;opacity:.07;background:repeating-linear-gradient(0deg,transparent 0 4px,#fff 5px)}.panel{position:absolute;z-index:2;inset:0;margin:auto;width:min(480px,calc(100% - 30px));height:max-content;padding:38px;text-align:center;border:1px solid #718292;background:linear-gradient(145deg,#1a2833ed,#080e15ed);box-shadow:inset 0 1px #d3e0e633,0 25px 70px #000e}.panel h1{font:800 clamp(45px,8vw,82px)/.85 Georgia,serif;margin:16px 0}.panel h2{font:700 44px/1 Georgia,serif;margin:15px 0}.panel em{color:var(--cyan);font-style:normal}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--cyan)}.panel p{color:#aeb9c2;line-height:1.7}.button{border:1px solid var(--cyan);background:var(--cyan);color:#061015;padding:14px 18px;font:bold 11px Consolas;letter-spacing:.1em;cursor:pointer;box-shadow:inset 0 1px #fff8,0 5px #123b3b}.button:hover{transform:translateY(2px);box-shadow:inset 0 1px #fff8,0 2px #123b3b}.hud{display:flex;gap:0;align-items:center;padding:10px 14px}.stat{min-width:128px;padding:3px 18px;border-right:1px solid #30424f;display:flex;flex-direction:column;gap:3px}.stat:first-child{padding-left:0}.label{color:var(--muted);font-size:9px;letter-spacing:.15em}.stat strong{font-size:19px}.cyan{color:var(--cyan)}.amber{color:var(--amber)}.red{color:var(--red)}.purple{color:var(--purple)}.barline{width:75px;height:3px;background:#303c47}.barline i{display:block;height:100%;background:var(--red)}.foot{padding:10px 14px;color:#6d7b86;font-size:9px;display:flex;justify-content:space-between}.text{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer}.text:hover{color:var(--cyan)}@media(max-width:720px){.shell{padding:10px}.stage{min-height:440px;justify-content:center}.hud{flex-wrap:wrap}.stat{min-width:25%;padding:4px 8px}.stat:first-child{padding-left:8px}.foot span{display:none}.foot{justify-content:flex-end;gap:15px}}
</style>
</head>
<body>
<main class="shell">
<header class="bar"><div class="brand"><b>//</b> UNPREDICTABLE</div><div class="signal"><i class="dot"></i><span id="signal">SIGNAL STABLE</span></div></header>
<section class="stage"><canvas id="game" aria-label="Standalone maze game"></canvas><div class="scan"></div><div class="panel" id="panel"><div class="eyebrow">FIELD TEST 001 / STANDALONE HTML</div><h1>UNPREDICTABLE</h1><p>A maze that edits the meaning of your next decision.</p><button class="button" id="start">START GAME</button></div></section>
<section class="hud"><div class="stat"><span class="label">LEVEL</span><strong id="level">1 / 5</strong></div><div class="stat"><span class="label">KEY</span><strong class="amber" id="key">LOCKED</strong></div><div class="stat"><span class="label">ATTEMPTS</span><strong class="amber" id="attempts">3</strong></div><div class="stat"><span class="label">ACCURACY</span><strong class="red" id="accuracy">100%</strong><span class="barline"><i id="accuracyBar" style="width:100%"></i></span></div><div class="stat"><span class="label">MOVES / TARGET</span><strong class="purple" id="moves">0 / 0</strong></div></section>
<footer class="foot"><span>ARROW KEYS // EXACT ROUTE // FOG ACTIVE</span><button class="text" id="restart">RESTART</button><button class="text" id="sound">SOUND ON</button></footer>
</main>
<script>
const maps=[['###############','#S....#.......#','#.###.#.#####.#','#...#.#.....#.#','###.#.#####.#.#','#...#.....#...#','#.#######.###.#','#.............#','#.###########.#','#............E#','###############'],['###############','#S....#.......#','#.###.#.#####.#','#...#.#.....#.#','#.#.#.#####.#.#','#.#.#.....#...#','#.#.#####.###.#','#.#...........#','#.###########.#','#............E#','###############'],['###############','#S....#.......#','#.###.#.#####.#','#...#.#.....#.#','###.#.#####.#.#','#...#.....#...#','#.#######.###.#','#.............#','#.###########.#','#............E#','###############'],['###############','#S....#.......#','#.###.#.#####.#','#...#.#.....#.#','#.#.#.#####.#.#','#.#.#.....#...#','#.#.#####.###.#','#.#...........#','#.###########.#','#............E#','###############'],['###############','#S....#.......#','#.###.#.#####.#','#...#.#.....#.#','#.#.#.#####.#.#','#.#.#.....#...#','#.#.#####.###.#','#.#...........#','#.###########.#','#............E#','###############']];
const starts=maps.map(()=>({x:1,y:1})), exits=maps.map(()=>({x:13,y:9})), keys=[{x:11,y:7},{x:11,y:7},{x:12,y:7},{x:10,y:7},{x:8,y:7}];
const c=document.querySelector('#game'),ctx=c.getContext('2d'),tile=48;let level=0,player={x:1,y:1},hasKey=false,accuracy=100,lowPresses=0,moves=0,target=0,attempts=3,running=false,phase=0,seed=Math.random();
const $=id=>document.querySelector(id), walk=(x,y)=>y>=0&&y<maps[level].length&&x>=0&&x<maps[level][0].length&&maps[level][y][x]!=='#';
function distance(from,to){let q=[{...from,d:0}],seen=new Set([from.x+','+from.y]);while(q.length){let p=q.shift();if(p.x===to.x&&p.y===to.y)return p.d;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let n={x:p.x+dx,y:p.y+dy},k=n.x+','+n.y;if(walk(n.x,n.y)&&!seen.has(k)){seen.add(k);q.push({...n,d:p.d+1})}}}return 999}
function reset(){player={...starts[level]};hasKey=false;lowPresses=0;moves=0;phase=0;seed=Math.random();target=distance(starts[level],keys[level])+distance(keys[level],exits[level]);sync();draw()}
function sync(){ $('level').textContent=`${level+1} / 5`; $('key').textContent=hasKey?'OPEN':'LOCKED';$('attempts').textContent=attempts;$('accuracy').textContent=accuracy+'%';$('accuracyBar').style.width=accuracy+'%';$('moves').textContent=`${moves} / ${target}` }
function draw(){let w=maps[level][0].length*tile+220;c.width=w;c.height=maps[level].length*tile*.82+55;ctx.clearRect(0,0,w,c.height);ctx.fillStyle='#050a0f';ctx.fillRect(0,0,w,c.height);ctx.save();ctx.translate(55,18);ctx.transform(1,0,-.22,.82,0,0);for(let y=0;y<maps[level].length;y++)for(let x=0;x<maps[level][y].length;x++)tileDraw(x,y,maps[level][y][x]==='#');entrance();fog();objects();ctx.restore()}
function tileDraw(x,y,wall){let px=x*tile,py=y*tile,t=(x*17+y*31+Math.floor(seed*3)*13)%5;if(wall){ctx.fillStyle='#101a22';ctx.fillRect(px,py,tile,tile);ctx.fillStyle='#263540';ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+tile,py);ctx.lineTo(px+tile-4,py+4);ctx.lineTo(px+4,py+4);ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#314550';ctx.strokeRect(px+.5,py+.5,tile-1,tile-1);ctx.strokeStyle='#162630';ctx.strokeRect(px+6.5,py+6.5,tile-13,tile-13)}else{ctx.fillStyle=(x+y)%2?'#081118':'#070d13';ctx.fillRect(px,py,tile,tile);ctx.strokeStyle='#1b2d37';ctx.strokeRect(px+.5,py+.5,tile-1,tile-1);ctx.fillStyle='#69818a';ctx.globalAlpha=.12;ctx.fillRect(px+10+t*2,py+13,2,1);ctx.globalAlpha=1}}
function entrance(){let y=starts[level].y*tile,start=-tile*1.3,end=tile;ctx.fillStyle='#0a151c';ctx.fillRect(start,y+8,end-start,tile-16);ctx.strokeStyle='#70f4df';ctx.globalAlpha=.45;ctx.strokeRect(start,y+8,end-start,tile-16);ctx.globalAlpha=1}
function fog(){let x=player.x*tile+tile/2,y=player.y*tile+tile/2,r=tile*2.7;ctx.save();ctx.fillStyle='#06090fa8';ctx.fillRect(-80,-50,c.width,c.height+80);ctx.globalCompositeOperation='destination-out';let g=ctx.createRadialGradient(x,y,tile*.7,x,y,r);g.addColorStop(0,'#000');g.addColorStop(.72,'#000c');g.addColorStop(1,'#0000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function glow(x,y,color,r){let g=ctx.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,color+'aa');g.addColorStop(1,color+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function objects(){let s=tile,ex=exits[level],kx=keys[level],x=ex.x*s+s/2,y=ex.y*s+s/2;glow(x,y,'#a98bff',34);ctx.strokeStyle='#a98bff';ctx.strokeRect(x-12,y-12,24,24);ctx.fillStyle='#a98bff';ctx.font='8px Consolas';ctx.fillText(hasKey?'OPEN':'LOCK',x-15,y+3);if(!hasKey){x=kx.x*s+s/2;y=kx.y*s+s/2;glow(x,y,'#f8b85e',28);ctx.fillStyle='#f8b85e';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();ctx.fillRect(x+5,y-2,13,4)}let p=player,px=p.x*s+s/2,py=p.y*s+s/2;glow(px,py,'#70f4df',40);ctx.fillStyle='#05080d';ctx.beginPath();ctx.ellipse(px,py+12,13,4,0,0,7);ctx.fill();let g=ctx.createRadialGradient(px-4,py-7,1,px,py+3,18);g.addColorStop(0,'#f2fffd');g.addColorStop(.3,'#70f4df');g.addColorStop(1,'#08938f');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(px,py+2,12,15,-.12,0,7);ctx.fill();ctx.beginPath();ctx.arc(px+2,py-10,9,0,7);ctx.fill();ctx.fillStyle='#071016';ctx.beginPath();ctx.arc(px+6,py-11,2,0,7);ctx.fill()}
function fail(title,body){running=false;$('panel').innerHTML=`<div class="eyebrow">RUN ENDED</div><h2>${title}</h2><p>${body}</p><button class="button" id="again">TRY AGAIN</button>`;$('panel').style.display='block';$('again').onclick=()=>{level=0;attempts=3;accuracy=100;reset();$('panel').style.display='none';running=true}}
function move(dir){if(!running)return;if(player.moving)return;let [dx,dy]={'up':[0,-1],right:[1,0],down:[0,1],left:[-1,0]}[dir],n={x:player.x+dx,y:player.y+dy};if(!walk(n.x,n.y))return;moves++;if(moves>target)return fail('BETTER LUCK NEXT TIME, TWIN.','The exact move route was exceeded.');accuracy=Math.max(1,accuracy-1);phase=(phase+1)%4;seed=(seed+.17)%1;player={...n};if(accuracy===1){lowPresses=0;$('signal').textContent='1% ACCURACY // 20 PRESSES PER MOVE'}if(n.x===keys[level].x&&n.y===keys[level].y)hasKey=true;if(n.x===exits[level].x&&n.y===exits[level].y&&hasKey){if(moves===target){level++;if(level===5)return fail('ESCAPE CONFIRMED','You beat the pattern.');attempts=3;reset()}else $('signal').textContent='MORE MOVES NEEDED'}sync();draw()}
window.onkeydown=e=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if(accuracy===1){lowPresses++;if(lowPresses<20){$('signal').textContent=`1% ACCURACY // ${lowPresses}/20 PRESSES`;return}lowPresses=0}move(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'})[e.key])};
$('start').onclick=()=>{running=true;$('panel').style.display='none';reset()};$('restart').onclick=()=>{attempts=3;reset()};$('sound').onclick=e=>e.target.textContent=e.target.textContent==='SOUND ON'?'SOUND OFF':'SOUND ON';reset();
</script>
</body>
</html>
